name: Construire l'appli Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du pont
        run: python tests/test_bridge.py
      - name: Dépendances
        run: python -m pip install -r app/requirements.txt
      - name: Construire l'exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dashboard LMU" --paths bridge --add-data "web;web" app/lmu_dashboard_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dashboard-LMU-exe
          path: dist/Dashboard LMU.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Dashboard LMU.exe
